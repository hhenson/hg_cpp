name: Test installed CMake SDK

# Tests a CMake install of the build tree that a wheel job already built, so this workflow compiles only the small SDK
# consumer projects.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      artifact:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Test installed SDK on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    env:
      CMAKE_GENERATOR: Ninja
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-14 g++-14 libicu-dev libcurl4-openssl-dev libssl-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install curl icu4c openssl@3
          echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=26.0" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl):$(brew --prefix icu4c):$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix curl)/lib:$(brew --prefix icu4c)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-vcpkg-packages
        with:
          packages: icu curl[openssl] openssl
      - name: Configure Windows dependency paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_ROOT
          "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$vcpkgRoot/installed/x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$vcpkgRoot/installed/x64-windows/bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HG_TEST_DLL_DIR=$vcpkgRoot/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Python build and test tools
        run: >-
          python -m pip install --only-binary=:all:
          "nanobind==3.1.0" "cmake>=3.31" "ninja==1.13.0" "pytest>=8,<9"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.artifact }}
      - name: Extract the install tree
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "hg-web-install"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          tar -C $prefix -xf install-tree.tar
          if ($LASTEXITCODE -ne 0) { throw "Extracting the install tree failed ($LASTEXITCODE)" }
          if ($IsWindows) {
            "$prefix/hgraph" | Out-File -FilePath $env:GITHUB_PATH -Append
            "$prefix/hg_web" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Test native TLS trust on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/hg-web-install
          HG_WEB_TEST_NATIVE_TRUST: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export no_proxy="$NO_PROXY"
          certificate="$GITHUB_WORKSPACE/extensions/web/tests/data/test_server_cert.pem"
          fingerprint="$(openssl x509 -in "$certificate" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          keychain=/Library/Keychains/System.keychain
          # Removing the admin trust setting blocks on hosted macOS runners. The runner is discarded after the job.
          trap 'sudo security delete-certificate -Z "$fingerprint" "$keychain"' EXIT
          sudo security add-trusted-cert -d -r trustRoot -k "$keychain" "$certificate"
          python -m pytest -q \
            "$GITHUB_WORKSPACE/extensions/web/tests_python/test_http_client.py" \
            "$GITHUB_WORKSPACE/extensions/web/tests_python/test_websocket.py" \
            -k 'https_client_ca_file_and_combined_transport_option or python_websocket_client_uses_native_trust'
      - name: Test installed SDK and Python web API on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/hg-web-install
        run: |
          cd "$RUNNER_TEMP"
          export no_proxy="$NO_PROXY"
          python "$GITHUB_WORKSPACE/tools/test_installed_sdk.py" --prefix "$RUNNER_TEMP/hg-web-install" --web
          python -m pytest -q "$GITHUB_WORKSPACE/extensions/web/tests_python"
      - name: Test installed SDK and Python web API on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONPATH: ${{ runner.temp }}/hg-web-install
        run: |
          Set-Location $env:RUNNER_TEMP
          python "$env:GITHUB_WORKSPACE/tools/test_installed_sdk.py" --prefix "$env:RUNNER_TEMP/hg-web-install" --web
          if ($LASTEXITCODE -ne 0) { throw "Installed SDK consumer failed ($LASTEXITCODE)" }
          $env:HG_WEB_PYTHON_TESTS = "$env:GITHUB_WORKSPACE/extensions/web/tests_python"
          python -c 'import os, pytest; dll_directory = os.add_dll_directory(os.environ["HG_TEST_DLL_DIR"]); raise SystemExit(pytest.main(["-q", os.environ["HG_WEB_PYTHON_TESTS"]]))'
          if ($LASTEXITCODE -ne 0) { throw "Installed web Python tests failed ($LASTEXITCODE)" }
